[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Knowledge Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "email-validator>=2.1,<3.0",
    "google-genai>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "pgvector>=0.4,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "structlog>=24.4,<26.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "reportlab>=4.2,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres_vector: requires a migrated disposable PostgreSQL + pgvector test database"]
